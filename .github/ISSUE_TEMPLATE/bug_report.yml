name: Bug report
description: Something in VibeDesk does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Tip: in VibeDesk, "Fehler melden" (Report a bug) opens a pre-filled issue with your versions and the error log instead of this form.
        German or English, both are fine. Security issues please report privately, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce help a lot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: vibedesk
    attributes:
      label: VibeDesk version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
      placeholder: e.g. 2.1.0
  - type: textarea
    id: log
    attributes:
      label: Error log (optional)
      description: The end of `%APPDATA%\vibedesk\logs\fehler.log`. Check it for anything private before posting.
      render: text
