# VibeDesk wird Stück für Stück nativ – jede Planke ist ein eigenes Crate (siehe README.md)
[workspace]
members = ["bridge", "layout"]
# die Programme für resources/bin; layout wird für wasm32 gebaut (build.mjs)
default-members = ["bridge"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/fxd-gif/vibedesk"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
